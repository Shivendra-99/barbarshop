<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>SalonSaathi — Book Your Appointment, Skip The Wait</title>
    <meta
      name="description"
      content="Book men's salons, unisex salons and beauty parlours near you. At the salon or at home, pay online or cash."
    />
    <meta
      name="keywords"
      content="salon booking, book salon online, beauty parlour near me, unisex salon, men's salon, salon appointment, home salon service, SalonSaathi"
    />
    <!--
      No canonical / og:url here on purpose: this one HTML file serves every
      route, so a hard-coded canonical would tell Google that every page is the
      homepage. src/lib/seo.js sets the right one per page.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.salonsaathi.in/#org",
            "name": "SalonSaathi",
            "url": "https://www.salonsaathi.in/",
            "logo": "https://www.salonsaathi.in/logo.png",
            "email": "supportsalonsaathi@gmail.com",
            "telephone": "+91-7081126830",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Jakhamai, Post Tiwaripur, Kunda",
              "addressLocality": "Pratapgarh",
              "addressRegion": "Uttar Pradesh",
              "postalCode": "230202",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.salonsaathi.in/#website",
            "name": "SalonSaathi",
            "url": "https://www.salonsaathi.in/",
            "publisher": { "@id": "https://www.salonsaathi.in/#org" }
          }
        ]
      }
    </script>

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SalonSaathi" />
    <meta property="og:title" content="SalonSaathi — Book Your Appointment, Skip The Wait" />
    <meta
      property="og:description"
      content="Book men's salons, unisex salons and beauty parlours near you. At the salon or at home, pay online or cash."
    />
    <meta property="og:image" content="https://www.salonsaathi.in/og/unisex.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalonSaathi — Book Your Appointment, Skip The Wait" />
    <meta
      name="twitter:description"
      content="Book men's salons, unisex salons and beauty parlours near you. At the salon or at home, pay online or cash."
    />
    <meta name="twitter:image" content="https://www.salonsaathi.in/og/unisex.jpg" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100f13" />

    <!--
      Applies a saved theme before first paint. Without this, a dark-mode user
      sees a flash of the cream theme while the bundle boots. Kept inline and
      dependency-free on purpose: it must run before any stylesheet paints.
      Mirrors the effect in src/store/Prefs.jsx.
    -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('salonsathi:v1:prefs:theme'))
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {
          /* private mode or corrupt value — fall back to the system theme */
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
